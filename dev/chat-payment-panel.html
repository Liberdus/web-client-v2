<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Send Crypto panel — harness</title>
<link rel="stylesheet" href="../styles.css" /></head>
<body>
<!-- Panel markup below is extracted verbatim from index.html at build time,
     so this harness cannot drift from what actually ships. -->
          <!-- Send an intents balance inside a conversation -->
          <div class="location-share-panel" id="chatPaymentPanel" style="display: flex;" role="dialog" aria-modal="true" aria-labelledby="chatPaymentTitle">
            <div class="voice-recording-content">
              <div class="voice-recording-header">
                <h3 id="chatPaymentTitle">Send Crypto</h3>
              </div>
              <div class="voice-recording-body">
                <div class="chat-payment-intro" id="chatPaymentIntro">&#8212;</div>
                <label class="chat-payment-label" for="chatPaymentAsset">Asset</label>
                <select id="chatPaymentAsset" class="form-control"></select>
                <label class="chat-payment-label" for="chatPaymentAmount">Amount</label>
                <div class="chat-payment-amount-row">
                  <input class="form-control" id="chatPaymentAmount" type="text" inputmode="decimal"
                    autocomplete="off" spellcheck="false" placeholder="0.0" />
                  <button type="button" class="chat-payment-max" id="chatPaymentMax">Max</button>
                </div>
                <label class="chat-payment-label" for="chatPaymentNote">Note (optional)</label>
                <input class="form-control" id="chatPaymentNote" type="text" maxlength="140"
                  autocomplete="off" placeholder="What is it for?" />
                <div class="chat-payment-status" id="chatPaymentStatus" hidden></div>
                <div class="voice-recording-controls chat-payment-actions">
                  <button type="button" class="voice-btn voice-btn-secondary" id="cancelChatPaymentButton">Cancel</button>
                  <button type="button" class="voice-btn voice-btn-primary" id="sendChatPaymentButton">Send</button>
                </div>
              </div>
            </div>
          </div>

<script type="module" src="./chat-payment-panel.js"></script>
</body></html>
