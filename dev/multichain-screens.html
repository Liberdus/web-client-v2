<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multichain screens — harness</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  /* Gallery: one phone-width frame per state, stacked. */
  body.gallery { margin:0 !important; background:#eef0f3 !important; display:block !important; padding:1px 0 40px; }
  .stage-label { width:375px; max-width:100%; margin: 18px auto 6px; font: 600 12px system-ui;
                 letter-spacing:.08em; text-transform:uppercase; color:#65676b; }
  .stage { display:block; width:375px; max-width:100%; height:720px; margin:0 auto 28px; border:0;
           background:white; box-shadow: 0 4px 20px rgba(0,0,0,.12); }

  /* Frame: the app's own layout, with the slide-in switched off so a screen
     is where it will settle rather than mid-transition. */
  body.frame { margin:0 !important; }
  body.frame .container { width:100%; height:100dvh; border-radius:0; box-shadow:none; }
  body.frame .modal { transition:none !important; }
  .harness-error { padding:16px; color:#c00; font: 13px/1.5 ui-monospace, monospace; white-space:pre-wrap; }
</style>
</head>
<body>
<script src="../external/qr.js"></script>
<script type="module" src="./multichain-screens.js"></script>
</body></html>
