<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liberdus group chat — MLS self-test</title>
    <style>
      :root {
        --bg: #0e1116; --panel: #161b22; --line: #2a3140; --fg: #d7dde7;
        --muted: #7d8899; --dim: #4a5464; --green: #7ee787; --red: #f7768e; --accent: #7aa2f7;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--fg); padding: 26px 20px 60px;
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .wrap { max-width: 880px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
      .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
      button { background: var(--accent); color: #0b1020; border: 0; border-radius: 7px;
               padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
      .summary { font-family: var(--mono); font-size: 13px; padding: 6px 12px; border-radius: 999px;
                 border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
      .summary.ok { color: var(--green); border-color: #24422c; background: #10251a; }
      .summary.bad { color: var(--red); border-color: #4a1f28; background: #241014; }
      ul { list-style: none; margin: 0; padding: 0; background: var(--panel);
           border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
      li { display: flex; align-items: baseline; gap: 10px; padding: 8px 14px;
           border-bottom: 1px solid #1b2029; font-size: 13.5px; }
      li:last-child { border-bottom: 0; }
      li.section { display: block; background: #12161d; color: var(--muted); font-size: 11px;
                   text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
      .mark { font-family: var(--mono); }
      li.ok .mark { color: var(--green); }
      li.bad .mark, li.bad .label { color: var(--red); }
      .label { flex: 1; }
      .detail { color: var(--dim); font-family: var(--mono); font-size: 11.5px; text-align: right; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Liberdus group chat — MLS self-test</h1>
      <p class="sub">
        Exercises mlsEngine.js, mlsStore.js and crypto.js interop in the browser, with no network
        and no wallet. Dev tool: verifies the crypto layer independently of the chain.
      </p>
      <div class="bar">
        <button id="run">Re-run</button>
        <span id="summary" class="summary">running…</span>
      </div>
      <ul id="results"></ul>
    </div>
    <script type="module" src="./mls-selftest.js"></script>
  </body>
</html>
