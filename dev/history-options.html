<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transaction history</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body { margin:0; background:#ececed; font-family:'Inter',sans-serif; }
      .page { max-width:1240px; margin:0 auto; padding:26px 20px 90px; }
      h2 { font-size:15px; margin:34px 0 4px; letter-spacing:-.01em }
      .why { font-size:12.5px; line-height:1.6; color:#65676b; margin:0 0 14px; max-width:78ch }
      .why code { background:#e2e2e8; padding:1px 4px; border-radius:3px; font-size:.9em }
      .why b { color:#3a3c48 }
      .pair { display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start }
      .col { width:340px }
      .lbl { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#797c8c; margin-bottom:6px }
      .lbl b.now { color:#8a2018 } .lbl b.rec { color:#1f6b2a }
      .stage { background:#fff; border:1px solid #dcdce4; border-radius:12px; height:700px;
               display:flex; flex-direction:column; overflow:hidden }
      .stage .modal-header { flex:none }
      .body { flex:1; overflow-y:auto; min-height:0 }

      /* ---------------------------------------------------------------
       * A SNAPSHOT of the old transaction rules, kept here on purpose.
       *
       * These were deleted from styles.css when the screen was rebuilt. This
       * page is the before/after record, so its "Now" column has to carry its
       * own copy — a comparison that depends on live app CSS stops being a
       * comparison the moment that CSS changes.
       * --------------------------------------------------------------- */
      /* Transaction History Styles */
      .transaction-list {
        margin-top: 1rem;
        max-width: 390px;
        margin: 0 auto;
      }
      .transaction-item {
        padding: 1rem;
      }
      .transaction-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .transaction-type {
        font-family: var(--font-primary);
        font-weight: var(--font-weight-semibold);
        color: var(--text-color);
      }
      .transaction-type.send {
        color: var(--danger-color);
      }
      .transaction-type.receive {
        color: var(--success-color);
      }
      .transaction-type.stake {
        color: var(--warning-color); /* Orange color for stake transactions */
      }
      .transaction-type.unstake-positive {
        color: var(--info-color); /* Blue color for positive unstake transactions */
      }
      .transaction-type.unstake-negative {
        color: var(--danger-color); /* Red color for negative unstake transactions */
      }
      /* Add visual distinction for stake transactions */
      .transaction-item[data-memo="stake"] {
        border-left: 3px solid var(--warning-color);
        padding-left: calc(1rem - 3px); /* Adjust padding to account for border */
      }
      /* Add visual distinction for unstake transactions */
      .transaction-item[data-memo="unstake"] {
        border-left: 3px solid var(--info-color); /* Default blue border for unstake */
        padding-left: calc(1rem - 3px); /* Adjust padding to account for border */
      }
      /* Override border color for negative unstake transactions */
      .transaction-item[data-memo="unstake"][data-amount-negative="true"] {
        border-left-color: var(--danger-color);
      }
      .transaction-amount {
        font-family: var(--font-primary);
        font-weight: var(--font-weight-semibold);
      }
      .transaction-details {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: var(--font-size-sm);
        color: var(--secondary-text-color);
        font-family: var(--font-primary);
      }
      .transaction-address {
        word-break: break-all;
        flex: 1;
        margin-right: 1rem;
      }
      .transaction-time {
        white-space: nowrap;
        color: var(--secondary-text-color);
      }
      .transaction-memo {
        margin-top: 0.5rem;
        font-size: var(--font-size-sm);
        color: var(--secondary-text-color);
        font-style: italic;
        font-family: var(--font-primary);
        overflow-wrap: break-word; /* Allow breaking long words */
        word-break: break-word; /* Ensure words break correctly */
        white-space: normal; /* Ensure text wraps */
      }
      /* Style for failed transactions in history */
      .transaction-item[data-status='failed'] {
        background-color: rgba(220, 53, 69, 0.08); /* Light red background */
        border-left: 3px solid var(--danger-color); /* Red border on the left */
        position: relative; /* Needed for absolute positioning of the icon */
        padding-right: 32px; /* Space for the icon on the right */
      }
      .transaction-item[data-status='failed']::after {
        content: '!';
        position: absolute;
        right: 8px; /* Position at the right of the transaction item */
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        background-color: var(--danger-color);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
        line-height: 1;
      }
      .transaction-item[data-status='failed'] {
        border-left: 4px solid var(--danger-color);
        padding-left: 10px; /* Add some padding so content doesn't touch the border */
      }
      /* Deleted transaction styling in history modal */
      .deleted-transaction {
        opacity: 0.6;
      }
      .deleted-transaction .transaction-type.deleted {
        color: var(--secondary-text-color) !important;
        font-style: italic;
        display: flex;
        gap: 6px;
      }
      .deleted-transaction .delete-icon {
        width: 16px;
        height: 16px;
        background-image: url("data:image/svg+xml,%3Csvg fill='none' stroke='%23888' stroke-width='2' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='3 6 5 6 21 6'/%3E%3Cpath d='M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/%3E%3Cline x1='10' y1='11' x2='10' y2='17'/%3E%3Cline x1='14' y1='11' x2='14' y2='17'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
      }
      .deleted-transaction .transaction-amount {
        color: var(--secondary-text-color) !important;
        font-style: italic;
      }
      .deleted-transaction .transaction-address {
        color: var(--secondary-text-color) !important;
        font-style: italic;
      }
      .deleted-transaction .transaction-memo {
        color: var(--secondary-text-color) !important;
        font-style: italic;
      }

      /* ---------- proposed ---------- */
      .tx-day { padding:18px 16px 6px; font-size:11px; font-weight:600; text-transform:uppercase;
                letter-spacing:.05em; color:var(--secondary-text-color); text-align:left }
      .tx { display:flex; align-items:center; gap:12px; width:100%; padding:10px 16px;
            border:0; background:none; cursor:pointer; font-family:var(--font-primary); text-align:left }
      .tx:hover { background:var(--hover-background) }
      /* The badge CANNOT live inside the clipped element. .tx-av-img carries the
         border-radius and overflow:hidden that round the avatar off; anything
         positioned inside it is clipped by that same circle, which is why the
         badge only showed the sliver that happened to overlap the avatar. The
         wrapper does the positioning and clips nothing. */
      .tx-av { flex:none; position:relative; width:38px; height:38px }
      .tx-av-img { display:block; width:100%; height:100%; border-radius:50%;
                   overflow:hidden; background:var(--light-color) }
      .tx-av-img svg { width:100%; height:100%; display:block }
      /* The direction badge rides the avatar, so who and which-way are one object.
       *
       * The glyph is a MASK, not a background image. --icon-arrow-out is drawn
       * with stroke:#ffffff — it was authored for the wallet's indigo Send
       * button — so used as a background on this white disc it is white on
       * white and simply does not appear. As a mask the artwork is only its
       * alpha, and the colour is ours to choose. */
      /* A light disc, ringed in the page colour. Both were white before, which on
         a white page left nothing but the arrow floating over the avatar's
         edge — the ring separates the badge FROM the avatar, so it cannot also
         be the badge's own fill. */
      .tx-dir { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
                background:var(--input-background); box-shadow:0 0 0 2px var(--background-color) }
      /* The mask is sized to the WHOLE 24px viewBox, not to the arrow: the
         artwork only spans units 7..17, so it already carries 29% padding on
         every side. Sizing the mask to 9px rendered a 3.7px arrow — a fragment.
         At 17px the arrow lands at ~7px inside a 17px disc, which is the
         proportion the icon was drawn for. */
      .tx-dir::before { content:''; position:absolute; inset:0;
                        background-color:var(--secondary-text-color);
                        -webkit-mask:var(--dir-icon) center / 17px no-repeat;
                        mask:var(--dir-icon) center / 17px no-repeat }
      .tx-dir--in::before { background-color:var(--success-color) }
      .tx-main { flex:1; min-width:0 }
      .tx-who { display:block; font-size:15px; font-weight:500; color:var(--text-color);
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
      .tx-sub { display:block; font-size:12.5px; color:var(--secondary-text-color); margin-top:1px;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
      .tx-right { flex:none; text-align:right }
      .tx-amt { display:block; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;
                color:var(--text-color) }
      .tx-amt--in { color:var(--success-color) }
      .tx-time { display:block; font-size:12px; color:var(--secondary-text-color); margin-top:1px;
                 font-variant-numeric:tabular-nums }
      /* Red means failed, and only failed. */
      .tx--failed .tx-amt { color:var(--danger-color); text-decoration:line-through }
      .tx--failed .tx-sub { color:var(--danger-color) }
    </style>
  </head>
  <body>
    <div class="page" id="page"></div>
    <script type="module">
      const { addressAvatar } = await import('../lib.js');
      const page = document.getElementById('page');
      const cs = getComputedStyle(document.documentElement);
      const OUT = cs.getPropertyValue('--icon-arrow-out').trim();
      const IN = cs.getPropertyValue('--icon-arrow-in').trim();

      const A = (s) => s.padEnd(64, '0');
      const P = {
        ana: A('a1b2c3d4e5f60718293a4b5c6d7e8f9012345678'),
        brave: A('b7c1d2e3f405162738495a6b7c8d9e0f11223344'),
        chen: A('c3d4e5f6071829304a5b6c7d8e9f001122334455'),
        unknown: A('9f2a11223344556677889900aabbccddeeff0011'),
      };

      const header = (t) => `<div class="modal-header"><button class="back-button"></button>
        <div class="modal-title">${t}</div></div>`;

      // ---------------- NOW ----------------
      const nowRow = (cls, type, amt, addr, time, memo) => `
        <div class="transaction-item">
          <div class="transaction-info">
            <div class="transaction-type ${cls}">${type}</div>
            <div class="transaction-amount">${amt}</div>
          </div>
          <div class="transaction-details">
            <div class="transaction-address">${addr}</div>
            <div class="transaction-time">${time}</div>
          </div>
          ${memo ? `<div class="transaction-memo">${memo}</div>` : ''}
        </div>`;

      const now = `
        ${header('Transaction History')}
        <div class="body"><div class="form-container">
          <div class="form-group"><label>Asset</label>
            <select class="form-control"><option>Liberdus (LIB)</option></select></div>
          <div class="transaction-list">
            ${nowRow('send', '↑ Sent', '- 25.000000 LIB', 'To: ana', '2:14 PM', 'For lunch')}
            ${nowRow('receive', '↓ Received', '+ 120.500000 LIB', 'From: brave', 'Yesterday, 9:02 AM', '')}
            ${nowRow('receive', '↓ Received', '+ 0.010000 LIB', 'From: 0x9f2a...c31d', 'Mar 14, 11:47 AM', 'Thanks!')}
            ${nowRow('stake', '↑ Staked', '- 500.000000 LIB', 'To: Validator 7', 'Mar 12, 4:20 PM', 'stake')}
          </div>
        </div></div>`;

      // ---------------- PROPOSED ----------------
      const tx = ({ who, addr, amt, time, memo, dir, failed }) => `
        <button class="tx${failed ? ' tx--failed' : ''}">
          <span class="tx-av">
            <span class="tx-av-img">${addressAvatar(addr, 38)}</span>
            <span class="tx-dir" data-dir="${dir}"></span></span>
          <span class="tx-main">
            <span class="tx-who">${who}</span>
            <span class="tx-sub">${memo || (dir === 'out' ? 'Sent' : 'Received')}</span>
          </span>
          <span class="tx-right">
            <span class="tx-amt${dir === 'in' && !failed ? ' tx-amt--in' : ''}">${amt}</span>
            <span class="tx-time">${time}</span>
          </span>
        </button>`;

      const proposed = `
        ${header('History')}
        <div class="body">
          <div class="tx-day">Today</div>
          ${tx({ who: 'Ana Ruiz', addr: P.ana, amt: '−25', time: '2:14 PM', memo: 'For lunch', dir: 'out' })}
          ${tx({ who: 'Chen Wei', addr: P.chen, amt: '−3.25', time: '11:03 AM', memo: '', dir: 'out', failed: true })}
          <div class="tx-day">Yesterday</div>
          ${tx({ who: 'Brave', addr: P.brave, amt: '+120.5', time: '9:02 AM', memo: '', dir: 'in' })}
          <div class="tx-day">14 March</div>
          ${tx({ who: '0x9f2a…c31d', addr: P.unknown, amt: '+0.01', time: '11:47 AM', memo: 'Thanks!', dir: 'in' })}
          ${tx({ who: 'Validator 7', addr: P.chen, amt: '−500', time: '4:20 PM', memo: 'Staked', dir: 'out' })}
        </div>`;

      page.innerHTML = `
        <h2>Transaction History — red means "you sent money", and also "this failed"</h2>
        <p class="why"><b><code>.transaction-type.send</code> is <code>--danger-color</code>.</b> Every
        successful outgoing payment is painted in the error colour. And
        <code>.transaction-item[data-status='failed']</code> is <i>also</i> <code>--danger-color</code>, with
        a red tint, a red left border and a red "!" badge. On one list, red means both "this worked" and
        "this did not". Sending money is not an error.</p>
        <p class="why">The list uses <b>five colours</b> for what is money in and money out: red for sent,
        green for received, orange for staked, blue for a positive unstake and red again for a negative one.
        There are also <b>two duplicate <code>[data-status='failed']</code> blocks</b> in the stylesheet with
        different left-border widths, 3px and 4px; the later one silently wins.</p>
        <p class="why"><b>Every amount is <code>toFixed(6)</code>.</b> "0.010000" and "120.500000" are nearly
        the same length, so the column cannot be scanned for size — which is the one thing a history list is
        for. <b>Nothing is left-aligned</b>: <code>.container</code>'s centring leaks, so the address, time
        and memo drift to the middle and no two rows share an edge. <b>There are no avatars</b>, in an app
        where chats, contacts, new chat and group members all have them. And <b>"To:" / "From:" repeats</b>
        what the arrow directly above it already said.</p>
        <p class="why">The proposal makes each row the shape of a chat row — avatar, who, amount — with the
        direction as a small badge on the avatar so <i>who</i> and <i>which way</i> are one object. Amounts
        are trimmed and <code>tabular-nums</code>, so a column of them can be read. Dates become day
        headings instead of a full date on every row. <b>Outgoing is plain text and incoming is green;</b>
        red is left to mean failed, which is the only thing on this screen that is actually wrong.</p>
        <div class="pair">
          <div class="col"><div class="lbl"><b class="now">Now</b></div><div class="stage">${now}</div></div>
          <div class="col"><div class="lbl"><b class="rec">Proposed</b></div><div class="stage">${proposed}</div></div>
        </div>`;

      // assigned from JS: a CSSOM url("…") cannot survive an inline style attribute
      for (const el of page.querySelectorAll('.tx-dir')) {
        const out = el.dataset.dir === 'out';
        el.style.setProperty('--dir-icon', out ? OUT : IN);
        el.classList.toggle('tx-dir--in', !out);
      }
    </script>
  </body>
</html>
