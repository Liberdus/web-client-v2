<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome &amp; create account</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body { margin:0; background:#ececed; font-family:'Inter',sans-serif; }
      .page { max-width:1180px; margin:0 auto; padding:26px 20px 90px; }
      h2 { font-size:15px; margin:30px 0 4px; }
      .why { font-size:12.5px; line-height:1.55; color:#65676b; margin:0 0 12px; max-width:72ch; }
      .why code { background:#e2e2e8; padding:1px 4px; border-radius:3px; font-size:.9em }
      .pair { display:flex; gap:22px; flex-wrap:wrap; }
      .col { width:330px; }
      .lbl { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#797c8c; margin-bottom:6px; }
      .lbl b.now { color:#8a2018 } .lbl b.rec { color:#1f6b2a } .lbl b.ok { color:#1f6b2a }
      .stage { background:#fff; border:1px solid #dcdce4; border-radius:12px; height:520px;
               display:flex; flex-direction:column; overflow:hidden; }

      /* ---------- proposed welcome ---------- */
      .w2 { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:32px 24px; text-align:center; gap:0 }
      .w2 img { width:104px; height:104px; }
      .w2-name { font-size:30px; font-weight:700; letter-spacing:-.02em; margin-top:18px; color:var(--text-color) }
      .w2-net { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:3px 10px;
                border-radius:999px; background:var(--warning-tint); color:var(--warning-text);
                font-size:12px; font-weight:600; letter-spacing:.02em }
      .w2-net::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor }
      .w2-actions { display:flex; flex-direction:column; gap:10px; width:100%; margin-top:36px }
      .w2-actions .btn { width:100%; height:48px; margin:0; border-radius:24px; font-size:15px }
      .w2-foot { padding:0 0 18px; text-align:center; font-size:11.5px; color:var(--muted-text-color) }

      /* ---------- proposed create ----------
         The action bar is PINNED. In the first draft the button sat after the
         content, so expanding Advanced moved it down the screen — a primary
         action that relocates between deciding to tap and tapping. */
      .c2-wrap { flex:1; display:flex; flex-direction:column; min-height:0 }
      .c2 { flex:1; overflow-y:auto; padding:20px 16px 8px; text-align:left }
      .c2 .form-control { height:52px }
      .c2-hint { font-size:12px; color:var(--secondary-text-color); margin:8px 0 0; line-height:1.45 }
      .c2-avail { font-size:12px; font-weight:600; color:var(--success-color); margin-left:6px }
      .c2-bar { flex:none; padding:12px 16px 16px; background:var(--background-color);
                border-top:1px solid var(--border-color) }
      .c2-bar .btn { width:100%; height:48px; margin:0; border-radius:24px; font-size:15px }

      .c2-disc summary { list-style:none; cursor:pointer }
      .c2-disc summary::-webkit-details-marker { display:none }
      .c2-row { display:flex; align-items:center; gap:10px; padding:13px 2px; border-top:1px solid var(--border-color);
                font-size:14px; color:var(--text-color) }
      .c2-row .k { flex:1 }
      .c2-row .v { color:var(--secondary-text-color); font-size:13px }

      /* The app's own tick, from .ui-list-pick — not a native checkbox. */
      .c2-opt { display:flex; align-items:center; gap:12px; padding:12px 2px; cursor:pointer }
      .c2-opt input { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none }
      .c2-opt .t { flex:1; min-width:0 }
      .c2-opt .t b { display:block; font-size:14px; font-weight:500 }
      .c2-opt .t span { display:block; font-size:12px; color:var(--secondary-text-color); margin-top:1px; line-height:1.4 }
      .c2-tick { flex:none; width:20px; height:20px; border:1.5px solid var(--border-color);
                 border-radius:6px; background:var(--background-color) }
      .c2-opt input:checked ~ .c2-tick {
        border-color:var(--primary-color);
        background:var(--primary-color) var(--icon-check-white) center / 14px 14px no-repeat; }
    </style>
  </head>
  <body>
    <div class="page" id="page"></div>
    <script type="module">
      const L = '../media/liberdus_logo_250.png';
      const page = document.getElementById('page');

      const nowWelcome = (returning) => `
        <div class="welcome-screen" style="flex:1;position:static;display:flex">
          <img src="${L}" style="margin-bottom:20px;width:160px;height:160px">
          <h1><span>Liberdus</span><br>
            <div style="font-size:0.8rem;margin-top:1px;text-align:center">Testnet</div></h1>
          <div class="welcome-buttons">
            ${returning ? '<button class="btn btn--primary btn--pill btn--full">Sign In</button>' : ''}
            <button class="btn ${returning ? 'btn--secondary' : 'btn--primary'} btn--pill btn--full">Create Account</button>
            <button class="btn btn--secondary btn--pill btn--full">Menu</button>
          </div>
          <div style="font-size:0.8rem;margin-top:10px;text-align:center">Version 2026.08.21.10.15</div>
        </div>`;

      const newWelcome = (returning) => `
        <div class="w2">
          <img src="${L}" alt="">
          <div class="w2-name">Liberdus</div>
          <div class="w2-net">Testnet</div>
          <div class="w2-actions">
            ${returning ? '<button class="btn btn--primary btn--pill">Sign in</button>' : ''}
            <button class="btn ${returning ? 'btn--secondary' : 'btn--primary'} btn--pill">Create account</button>
            <button class="btn btn--text" style="height:40px">More options</button>
          </div>
        </div>
        <div class="w2-foot">2026.08.21.10.15</div>`;

      const nowCreate = `
        <div class="modal-header" style="flex:none"><button class="back-button"></button>
          <div class="modal-title">Create account</div></div>
        <div style="flex:1;overflow:auto"><div class="form--narrow">
          <div class="form-group"><label>Username <span style="color:#28a745">available</span></label>
            <input class="form-control" placeholder="Select a username"></div>
          <div class="form-actions"><button class="btn btn--primary btn--pill btn--full">Create Account</button></div>
          <div class="form-group u-mt-20"><input type="checkbox"><label style="display:inline;margin-left:5px">More Options</label></div>
          <div class="form-group form-group--checkbox"><input type="checkbox"><label>Make this a private account</label></div>
          <div class="form-group form-group--checkbox"><input type="checkbox"><label>Use my own private key (Advanced)</label></div>
          <div class="form-group" style="margin-top:50px;padding:0 16px">
            <label>Check if you have accounts that can be migrated to this network</label>
            <div class="form-actions"><button class="btn btn--secondary btn--pill btn--full">Migrate Accounts</button></div>
          </div>
        </div></div>`;

      const opt = (name, desc, checked) => `
        <label class="c2-opt">
          <input type="checkbox" ${checked ? 'checked' : ''}>
          <span class="t"><b>${name}</b><span>${desc}</span></span>
          <span class="c2-tick" aria-hidden="true"></span>
        </label>`;

      const newCreate = (open) => `
        <div class="modal-header" style="flex:none"><button class="back-button"></button>
          <div class="modal-title">Create account</div></div>
        <div class="c2-wrap">
          <div class="c2">
            <label class="form-label" style="font-size:13px;font-weight:500">Username<span class="c2-avail">available</span></label>
            <input class="form-control" value="thantsintoe" style="margin-top:6px">
            <p class="c2-hint">This is how people find you, and it is permanent — an account name cannot be changed once it is taken.</p>
            <details class="c2-disc" style="margin-top:22px" ${open ? 'open' : ''}>
              <summary><div class="c2-row"><span class="k">Advanced</span><span class="v">${open ? '▾' : '▸'}</span></div></summary>
              ${opt('Private account', 'Only reachable by people who already have your address.', true)}
              ${opt('Use my own private key', 'Otherwise one is generated for you.', false)}
            </details>
          </div>
          <div class="c2-bar"><button class="btn btn--primary btn--pill">Create account</button></div>
        </div>`;

      page.innerHTML = `
        <h2>Welcome — returning user <span style="font-size:11px;color:#1f6b2a">(already correct: Sign in leads)</span></h2>
        <p class="why">The button hierarchy is <b>already right</b> and I am not changing it — <code>renderWelcomeButtons</code> makes Sign in primary when the device has accounts and Create account primary when it does not, and hides Sign in entirely for a new user. What I would change is around it: the wordmark carries a <code>text-shadow</code>, the network is 0.8rem of grey text, and the version has the same weight as the network. For a wallet, <b>which network you are on is safety information</b> — a testnet mistake with real money is not recoverable — so it becomes a badge, and shows nothing at all on mainnet where no warning is due.</p>
        <div class="pair">
          <div class="col"><div class="lbl"><b class="now">Now</b></div><div class="stage">${nowWelcome(true)}</div></div>
          <div class="col"><div class="lbl"><b class="rec">Proposed</b></div><div class="stage">${newWelcome(true)}</div></div>
          <div class="col"><div class="lbl"><b class="ok">Proposed — new user</b></div><div class="stage">${newWelcome(false)}</div></div>
        </div>

        <h2>Create account</h2>
        <p class="why">The submit button sits <b>between the username field and the rest of the form</b>, so the form carries on after its own submit. "More Options" is a bare checkbox used as a disclosure — a checkbox means "this will be true", not "show me more". And <b>Migrate Accounts is a duplicate</b>: the same action is already in the welcome Menu, and here it is an unrelated block competing with the one thing this screen is for. The username is also permanent — it is hashed to your address and cannot be changed — which is worth one line <i>before</i> someone picks one, not after.</p>
        <p class="why"><b>Two fixes from the first draft.</b> The button is now <b>pinned to the bottom</b>: it sat after the content, so opening Advanced pushed it down the screen — a primary action that relocates between deciding to tap and tapping is how mis-taps happen. Compare the two proposed frames below: the button is in the same place in both. And the native checkboxes are gone in favour of <code>.ui-list-check</code>, the tick this app already uses in the group member picker — reaching for a browser default when the design system has the control was simply an oversight.</p>
        <div class="pair">
          <div class="col"><div class="lbl"><b class="now">Now</b></div><div class="stage">${nowCreate}</div></div>
          <div class="col"><div class="lbl"><b class="rec">Proposed — collapsed</b></div><div class="stage">${newCreate(false)}</div></div>
          <div class="col"><div class="lbl"><b class="rec">Proposed — expanded</b></div><div class="stage">${newCreate(true)}</div></div>
        </div>`;
    </script>
  </body>
</html>
